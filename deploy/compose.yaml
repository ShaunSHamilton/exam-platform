# The Droplet's own services: Komodo (MongoDB, Core, Periphery), and Caddy, the public entry for
# Komodo and the apps. Adapted from Komodo's compose/mongo.compose.yaml (v2.3.3). Setup: README.md.
#
# bootstrap.sh runs it. Never deploy it as a Komodo stack: redeploying Core from Core cuts off the
# deploy halfway. Hosts and secrets come from .env (see .env.example), which stays on the Droplet.
name: komodo

services:
  mongo:
    # 8.0, not 9: Komodo 2.3.3 builds against mongodb driver 3.7, which predates server 9.0.
    image: mongo:8.0
    labels:
      komodo.skip: # StopAllContainers leaves it running; Core and Periphery images carry it
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME:?set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD:?set in .env}

  core:
    image: ghcr.io/moghtech/komodo-core:2.3.3
    init: true
    restart: unless-stopped
    depends_on: [mongo]
    # Caddy is the way in. This is the fallback while Caddy is down: ssh -L 9120:127.0.0.1:9120.
    ports: ["127.0.0.1:9120:9120"]
    environment:
      KOMODO_HOST: https://${KOMODO_DOMAIN:?set in .env}
      KOMODO_TITLE: Exam Platform
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DATABASE_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET:?set in .env}
      KOMODO_WEBHOOK_SECRET: ${KOMODO_WEBHOOK_SECRET:?set in .env}
      # The login page is public. The first start creates the admin from .env; nobody can sign up.
      # Admins add users under Settings → Users, and everyone turns on passkey or TOTP 2FA.
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_INIT_ADMIN_USERNAME: ${KOMODO_INIT_ADMIN_USERNAME:?set in .env}
      KOMODO_INIT_ADMIN_PASSWORD: ${KOMODO_INIT_ADMIN_PASSWORD:?set in .env}
      KOMODO_DISABLE_USER_REGISTRATION: "true"
      KOMODO_MIN_PASSWORD_LENGTH: "16"
      KOMODO_DISABLE_NON_ADMIN_CREATE: "true"
      KOMODO_CORS_ALLOWED_ORIGINS: https://${KOMODO_DOMAIN}
      # The co-located Periphery: the server the stacks in exam-platform.toml target.
      KOMODO_FIRST_SERVER_NAME: exam-platform
      KOMODO_PERIPHERY_PUBLIC_KEY: file:/config/keys/periphery.pub
      TZ: Etc/UTC
    volumes:
      - keys:/config/keys
      # Daily "Backup Core Database" procedure; keeps the newest 14.
      - /etc/komodo/backups:/backups

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.3
    init: true
    restart: unless-stopped
    depends_on: [core]
    environment:
      PERIPHERY_CORE_ADDRESS: ws://core:9120
      PERIPHERY_CONNECT_AS: exam-platform
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
      TZ: Etc/UTC
    volumes:
      - keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      # Stacks clone here. Same path inside and outside: compose runs against the host's Docker.
      - /etc/komodo:/etc/komodo

  caddy:
    image: caddy:2.11.7-alpine
    labels:
      komodo.skip:
    restart: unless-stopped
    depends_on: [core]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      KOMODO_DOMAIN: ${KOMODO_DOMAIN}
      EXAMINER_DASHBOARD_DOMAIN: ${EXAMINER_DASHBOARD_DOMAIN:?set in .env}
    volumes:
      # The directory, not the file: `git pull` replaces the file, and `caddy reload` must see it.
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    # default reaches Core; platform reaches the apps by their network aliases.
    networks: [default, platform]

networks:
  # The apps' shared network (apps/*/compose.yaml). bootstrap.sh creates it.
  platform:
    name: platform
    external: true

volumes:
  mongo-data:
  mongo-config:
  keys:
  caddy-data:
  caddy-config:
