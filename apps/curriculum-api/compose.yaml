# Local: `docker compose up --build` from this directory; the build context is the repo root.
# Production runs this same file: Komodo stack `exam-platform-curriculum-api`
# (deploy/exam-platform.toml) sets IMAGE to a release digest and never builds. Keep
# machine-specific values in .env.
# Services address each other over the shared `platform` network; create it once with
# `docker network create platform`.
services:
  curriculum-api:
    # Unset: compose builds from source and names the image itself.
    image: ${IMAGE:-}
    build:
      context: ../..
      dockerfile: apps/curriculum-api/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:${CAPI_PORT:-13002}:13002"]
    environment:
      LISTEN_ADDR: 0.0.0.0:13002
      # Required: release images refuse to start without it. staging/production also need SENTRY_DSN.
      ENVIRONMENT: ${ENVIRONMENT:?set ENVIRONMENT to development, staging or production}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.2}
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      platform:
        aliases: [curriculum-api]
networks:
  platform:
    name: ${PLATFORM_NETWORK:-platform}
    external: true
