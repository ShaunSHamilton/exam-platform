[package]
name = "desktop-app"
version = "0.1.0"
description = "Exam Platform desktop app (dApp)"
authors = ["freeCodeCamp"]
edition = "2024"
rust-version = "1.99"
publish = false

[build-dependencies]
dotenvy = "0.15.7"
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
runtime = { path = "../../../libs/runtime", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.1", features = [] }
tracing = "0.1.44"

[lints]
workspace = true
