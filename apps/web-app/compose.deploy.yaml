# Deployment variant of compose.yaml: Komodo stack `exam-platform-web-app` (deploy/komodo/exam-platform.toml)
# runs the released image by digest instead of building. Komodo writes the stack environment to
# the env file compose interpolates. IMAGE is the release's digest, set per deploy; secrets come
# from Komodo, never this repository.
services:
  web-app:
    image: ${IMAGE:?set IMAGE to registry.digitalocean.com/<registry>/web-app@sha256:<digest>}
    restart: unless-stopped
    ports: ["127.0.0.1:${WAPP_PORT:-13004}:13004"]
    networks:
      platform:
        aliases: [web-app]
networks:
  platform:
    name: ${PLATFORM_NETWORK:?set PLATFORM_NETWORK to the environment's shared network}
    external: true
