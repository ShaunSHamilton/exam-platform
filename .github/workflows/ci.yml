name: CI

on:
  pull_request:
  # Main keeps the caches PRs restore from.
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.2

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's files through the API
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      desktop: ${{ steps.filter.outputs.desktop }}
      bun: ${{ steps.filter.outputs.bun }}
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Shared inputs reach an app through its inputs.lock, so `apps/<app>/**` covers them.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            rust:
              - *ci
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - rustfmt.toml
              - libs/**
              - apps/auth-api/**
              - apps/curriculum-api/**
              - apps/examiner-dashboard/server/**
            desktop:
              - *ci
              - Cargo.toml
              - rust-toolchain.toml
              - rustfmt.toml
              - libs/**
              - apps/desktop-app/**
            bun:
              - *ci
              - package.json
              - bun.lock
              - apps/web-app/**
              - apps/examiner-dashboard/client/**
              - apps/desktop-app/**
            auth-api: [*ci, apps/auth-api/**]
            curriculum-api: [*ci, apps/curriculum-api/**]
            examiner-dashboard: [*ci, apps/examiner-dashboard/**]
            web-app: [*ci, apps/web-app/**]
      - id: images
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          images=$(jq -r '.[]' <<<"$CHANGES" | while read -r app; do
            if [[ -f "apps/$app/Dockerfile" ]]; then echo "$app"; fi
          done | jq -Rnc '[inputs]')
          echo "images=$images" >> "$GITHUB_OUTPUT"

  inputs:
    name: Release inputs
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `toolchain` input, and rust-toolchain.toml sets no channel: the runner image's Rust, never newer.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-workspaces: |
            .
            apps/desktop-app
          cache-targets: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run inputs --check

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `toolchain` input, and rust-toolchain.toml sets no channel: the runner image's Rust, never newer.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      # dApp builds runtime without `server`; clippy only lints workspace members.
      - run: cargo clippy -p runtime --no-default-features --all-targets --locked
      - run: cargo test --workspace --locked

  desktop:
    name: Desktop Rust
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      # backend/build.rs requires SENTRY_DSN outside development.
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # https://v2.tauri.app/start/prerequisites/#linux
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      # No `toolchain` input, and rust-toolchain.toml sets no channel: the runner image's Rust, never newer.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-workspaces: apps/desktop-app
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check --manifest-path apps/desktop-app/Cargo.toml
      - run: cargo clippy --workspace --all-targets --locked --manifest-path apps/desktop-app/Cargo.toml
      - run: cargo test --workspace --locked --manifest-path apps/desktop-app/Cargo.toml

  bun:
    name: Bun
    needs: changes
    if: needs.changes.outputs.bun == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      # desktop-app's vite.config.ts requires AUTH_API_URL outside development.
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  docker:
    name: Docker (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build only. Release builds push from the same Dockerfile and cache scope (release.yml).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope={0}', matrix.app) || '' }}

  # Single required check: skipped jobs count as passed.
  pass:
    name: CI passed
    if: always()
    needs: [changes, inputs, rust, desktop, bun, docker]
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'all(. == "success" or . == "skipped")' <<<"$RESULTS"
